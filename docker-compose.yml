version: '3.8'

services:
  # 1. Database
  postgres:
    image: postgres:16-alpine
    container_name: ai-erp-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - ai-erp-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. API Backend
  api:
    build: ./apps/api
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    ports:
      - "${LOCAL_API_PORT_MAP:-127.0.0.1:8000:8000}"
    networks:
      - ai-erp-network

  # 3. Web Frontend
  web:
    build: ./apps/web
    restart: always
    ports:
      - "${LOCAL_WEB_PORT_MAP:-127.0.0.1:5173:5173}"
    networks:
      - ai-erp-network

  # 4. n8n Automation
  n8n:
    image: n8nio/n8n:latest
    restart: always
    environment:
      - N8N_HOST=${N8N_HOST:-n8n.munshiai.co.in}
      - N8N_PORT=5678
      - N8N_PROTOCOL=${N8N_PROTOCOL:-https}
      - N8N_USER_MANAGEMENT_DISABLED=false
      - N8N_SECURE_COOKIE=true
      - WEBHOOK_URL=${WEBHOOK_URL:-https://n8n.munshiai.co.in/}
      - GENERIC_TIMEZONE=Asia/Kolkata
      - ERP_API_BASE_URL=http://api:8000
      - ERP_API_KEY=${N8N_API_KEY}
    ports:
      - "${LOCAL_N8N_PORT_MAP:-127.0.0.1:5678:5678}"
    volumes:
      - n8n-data:/home/node/.n8n
    networks:
      - ai-erp-network

  # 5. Database Admin UI
  adminer:
    image: adminer
    restart: always
    ports:
      - "${LOCAL_ADMINER_PORT_MAP:-127.0.0.1:8080:8080}"
    networks:
      - ai-erp-network

  # 6. Caddy Reverse Proxy
  caddy:
    image: caddy:latest
    restart: always
    ports:
      - "${CADDY_HTTP_PORT:-80:80}"
      - "${CADDY_HTTPS_PORT:-443:443}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
    networks:
      - ai-erp-network

networks:
  ai-erp-network:
    driver: bridge

volumes:
  postgres-data:
  n8n-data:
  caddy_data:
  
adminer:
    image: adminer
    restart: always
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - ai-erp-network
    depends_on:
      - postgres
