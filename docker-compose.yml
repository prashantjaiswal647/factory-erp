version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: ai-erp-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - ai-erp-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: ./apps/api
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    networks:
      - ai-erp-network

  web:
    build: ./apps/web
    restart: always
    networks:
      - ai-erp-network

  n8n:
    image: n8nio/n8n:latest
    restart: always
    environment:
      - N8N_HOST=0.0.0.0
      - N8N_PORT=5678
      - N8N_PROTOCOL=https
      - WEBHOOK_URL=https://n8n.munshiai.co.in/
      - GENERIC_TIMEZONE=Asia/Kolkata
      - ERP_API_BASE_URL=http://api:8000
      - ERP_API_KEY=${N8N_API_KEY}
    volumes:
      - n8n-data:/home/node/.n8n
    networks:
      - ai-erp-network

  caddy:
    image: caddy:latest
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
    networks:
      - ai-erp-network

networks:
  ai-erp-network:
    driver: bridge

volumes:
  postgres-data:
  n8n-data:
  caddy_data:
