services:
  # 1. Database
  postgres:
    image: postgres:16-alpine
    container_name: ai-erp-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ai_erp_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - ./volumes/postgres_data:/var/lib/postgresql/data
    networks:
      - ai-erp-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-ai_erp_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Redis Cache
  redis:
    image: redis:7-alpine
    container_name: ai-erp-redis
    restart: always
    volumes:
      - ./volumes/redis_data:/data
    networks:
      - ai-erp-network

  # 3. API Backend
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: ai-erp-api
    restart: always
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/ai_erp_db}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173,http://127.0.0.1:5173,https://munshiai.co.in,https://www.munshiai.co.in}
    ports:
      - "8000:8000"
    networks:
      - ai-erp-network

  # 4. Web Frontend
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-}
    container_name: ai-erp-web
    restart: always
    ports:
      - "3000:80"
    networks:
      - ai-erp-network

  # 5. n8n Automation
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: ai-erp-n8n
    restart: always
    environment:
      - N8N_PORT=5678
      - GENERIC_TIMEZONE=Asia/Kolkata
    ports:
      - "5678:5678"
    volumes:
      - ai-erp-n8n-data:/home/node/.n8n
    networks:
      - ai-erp-network

  # 6. Public Reverse Proxy
  caddy:
    image: caddy:2-alpine
    restart: always
    depends_on:
      - api
      - web
      - n8n
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./volumes/caddy_data:/data
      - ./volumes/caddy_config:/config
    networks:
      - ai-erp-network

  # 7. Database Admin UI
  adminer:
    image: adminer:latest
    restart: always
    depends_on:
      - postgres
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - ai-erp-network

networks:
  ai-erp-network:
    driver: bridge

volumes:
  ai-erp-n8n-data:
